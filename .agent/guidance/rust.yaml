version: 1
scope:
  paths:
  - rust/**
  - crates/**
  languages:
  - rust
rules:
- id: rust-public-debug
  slot: rust.public_debug
  description: Public Rust types must implement Debug.
  checker: rust_public_debug
  severity: warning
- id: rust-strict-clippy
  slot: rust.clippy
  description: Run strict clippy guidance for Rust code.
  checker: advisory
  severity: warning
