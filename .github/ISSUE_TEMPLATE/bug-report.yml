name: Bug report
description: Report incorrect or unexpected behavior with explicit reproduction details
title: "[Bug]: "
labels:
  - bug

body:
- type: markdown
  attributes:
    value: |
      <!-- AGENT_ONLY: Keep each section explicit, concise, and copy-paste ready. -->
      <!-- AGENT_ONLY: Replace every {{PLACEHOLDER}} with repository-specific details before submitting. -->
      Before submitting a bug, confirm that the problem is not already tracked in an existing issue.
- type: textarea
  id: context
  attributes:
    label: Context / Background
    description: |
      Describe the task, workflow, or command that exposed the problem and why it matters.
    placeholder: |
      {{CONTEXT}}
      Example:
      - Goal: build the template repository after cloning it
      - Trigger: run `pre-commit run --all-files`
      - Impact: contributors cannot validate changes locally
  validations:
    required: true
- type: textarea
  id: reproduction_steps
  attributes:
    label: Reproduction Steps
    description: Provide a deterministic, minimal sequence that someone else can copy and run.
    placeholder: |
      1. {{STEP_1}}
      2. {{STEP_2}}
      3. {{STEP_3}}
  validations:
    required: true
- type: textarea
  id: expected_behavior
  attributes:
    label: Expected Behavior
    description: Explain what should happen when the reproduction steps are followed.
    placeholder: |
      {{EXPECTED_BEHAVIOR}}
  validations:
    required: true
- type: textarea
  id: actual_behavior
  attributes:
    label: Actual Behavior
    description: Explain what actually happened, including error messages or incorrect output.
    placeholder: |
      {{ACTUAL_BEHAVIOR}}
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: |
      Capture the runtime context needed to reproduce the issue.
    placeholder: |
      - OS: {{OPERATING_SYSTEM}}
      - Compiler / interpreter: {{TOOLCHAIN_VERSION}}
      - Commit / branch: {{COMMIT_OR_BRANCH}}
      - Additional dependencies: {{DEPENDENCIES}}
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Screenshots / Logs
    description: Paste relevant logs, stack traces, screenshots, or a minimal failing snippet if available.
    placeholder: |
      ```text
      {{LOGS_OR_TRACEBACK}}
      ```
- type: textarea
  id: agent_notes
  attributes:
    label: Agent-Specific Notes
    description: Record any constraints, guardrails, acceptance criteria, or review notes that a coding agent should preserve.
    placeholder: |
      {{AGENT_NOTES}}
      Example:
      - Keep the fix minimal and avoid unrelated refactors
      - Reuse existing tooling instead of adding new dependencies
- type: markdown
  attributes:
    value: |
      Thanks for contributing.
